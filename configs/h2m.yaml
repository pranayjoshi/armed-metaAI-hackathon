# Human2Machine runtime configuration.
# Every threshold that affects what the robot does lives here, not in code.

objects:
  # What is on the table. `prompt` is what the detector looks for and what
  # people can say ("hand me the cup"). `max_grip` caps squeeze for that object
  # (0 = gripper fully open, 1 = hardest allowed squeeze).
  - id: cup
    name: paper cup
    prompt: paper cup
    max_grip: 0.35
  - id: block
    name: wooden block
    prompt: wooden block
    max_grip: 0.9
  - id: ball
    name: tennis ball
    prompt: tennis ball
    max_grip: 0.6

speech:
  source: mic            # mic | off  (typed commands always work)
  asr: parakeet          # parakeet | whisper
  sample_rate_hz: 16000
  device: null           # sounddevice name or index; null = default input
  vad_start_ratio: 3.0   # speech when frame RMS > ratio x noise floor
  silence_end_ms: 450
  preroll_ms: 250
  max_utterance_ms: 6000
  # While the robot speaks and this long after, heard speech is tagged as echo: it can
  # still stop or cancel, never confirm or start a request.
  echo_tail_ms: 500
  voice_out: true        # speak `say` tool replies with macOS `say` (cut off on stop/brace)
  voice: null            # `say -v` voice name; null = system default
  rate_wpm: null         # `say -r` words per minute; null = default

vision:
  source: camera         # camera | off
  scene_camera: 0        # overhead camera index
  wrist_camera: 1        # wrist camera index, null to disable
  width: 1280
  height: 720
  detector: yoloe        # yoloe | none
  detector_model: yoloe-26s-seg.pt
  min_confidence: 0.25
  pointing: true         # MediaPipe hand landmarks -> pointing target
  publish_hz: 10
  stale_ms: 800          # objects unseen this long are dropped
  # Image -> table homography from `h2m calibrate-table`; null = normalized image coords.
  table_homography: null

emg:
  source: ganglion       # ganglion | synthetic | off
  transport: ble         # ble | usb_dongle
  serial_port: null      # usb_dongle only
  mac_address: null      # optional BLE address / CoreBluetooth UUID
  firmware: 2            # 2 | 3 | auto; this board reports 2 in the OpenBCI GUI
  sample_rate_hz: 200
  # Electrode placement: flexors squeeze (grip + confirm), extensors open-hand (stop).
  flexor_channels: [0]
  extensor_channels: [1]
  bandpass_hz: [20, 90]
  notch_hz: 60
  window_ms: 250
  hop_ms: 50
  smoothing: 0.35        # EMA on effort, 0..1 (higher = faster)
  confirm_effort: 0.30   # squeeze above this ...
  confirm_hold_ms: 350   # ... for this long confirms a pending request
  stop_effort: 0.55      # extensor effort above this vetoes motion
  stop_hold_ms: 80
  # Brace (flinch): min(flexor, extensor) on a faster window, normalized per user.
  # Priority is brace > open hand > squeeze.
  # brace_feature: flexor_spike ships and means OR: co-contraction at brace_effort, OR a
  # flexor-only spike at the higher brace_spike_effort. cocontraction = the first trigger only.
  # Replay of the recorded flinch runs (data/flinch, 12 flinches), shipped config: the OR
  # variant stopped the arm (brace or open hand) on 10/12, with no squeeze or twitch after any
  # flinch; the 2 misses peak at ~0.3, under every threshold. 10 of the 12 reach fast flexor
  # >= 0.9, so they sit in the spike band whatever the extensors do. The spike threshold is
  # above the twitch band, so a flexor-only twitch is never a brace, and a flexor-only flinch
  # that reaches brace_spike_effort always is one. A twitch-band burst can still freeze a
  # MOVING arm, but only through emg.burst_onset with burst_freeze: true (below; off by
  # default). (An earlier "both features scored identically" held for one run only.)
  brace_feature: flexor_spike  # flexor_spike (the OR) | cocontraction (co-contraction only)
  brace_window_ms: 100   # parallel fast window, same hop as above
  brace_smoothing: 0.6   # EMA on the fast flexor / extensor, 0..1
  brace_effort: 0.35     # brace feature above this counts as co-contraction
  brace_spike_effort: 0.6  # flexor-only spike (flexor_spike mode) above this is a brace; twitch_max_effort must not exceed it
  brace_calm: 0.12       # "calm baseline": brace at or below this before the rise
  brace_rise_ms: 150     # must be calm this long before crossing: slower ramps are ignored
  brace_baseline_ms: 250 # ... and have stayed calm for this long before that
  brace_hold_hops: 2     # hops (hop_ms each) above brace_effort before firing
  # After a brace or an open hand, squeeze and twitch are suppressed (open hand never is).
  # 3000 was tried: the flinch replays stay clean, but the detector tests are written to the
  # 1.5 s lockout, so it stays; the app refuses any squeeze or rule approval within
  # safety.after_stop_s (3 s) of a brace, open hand or burst stop instead.
  brace_lockout_ms: 1500
  brace_trace_ms: 1500   # recent fast trace carried by emg.brace
  cocontraction_effort: 0.18  # squeeze needs extensors below this (well under brace_effort), so a brace never confirms
  cocontraction_ratio: 0.6    # ... or below this share of flexor effort: a hard fist leaks into the extensors (the limit is capped at brace_effort)
  cocontraction_ratio_min: 0.8  # the ratio applies only at this flexor effort or above, on a calibrated profile
  # Twitch: a short flexor-only burst (fast window, normalized to the user's fist) from a calm
  # baseline, over within twitch_max_ms. Decided on the falling edge. Two within
  # twitch_double_ms (onset to onset) = emg.double_twitch. A lone twitch is emitted only once the
  # double window has passed (twitch_double_ms after its onset). Brace > open hand > twitch:
  # any brace/open hand/squeeze, a busy or slow rise, or extensors above twitch_extensor_max
  # voids the burst. A twitch lives in [twitch_effort, twitch_max_effort): a burst that reaches
  # twitch_max_effort (= brace_spike_effort) is a brace's, never a twitch. emg.burst_onset (payload
  # onset_t only) fires on the first hop of a calm rise above twitch_effort, so a MOVING arm can
  # freeze at once instead of after the 0.6 s the lone twitch is held back.
  twitch: true
  # SAFETY REVIEW. burst_freeze: true makes the app act on emg.burst_onset: a MOVING arm stops
  # (latched until reset + arm) and a plan in flight on a READY arm is dropped (request epoch,
  # no latch). A burst stop proposes no rule unless a brace or open hand follows within 2 s.
  # Off by default: enable it only after a bench session has measured how often real
  # moving-arm sessions fire bursts (false stops). selection.enabled alone does not enable it.
  # Only the literal true turns it on.
  burst_freeze: false
  twitch_effort: 0.35    # fast flexor level that opens a burst
  twitch_max_effort: 0.6 # at or above this fast flexor level the burst is not a twitch (same value as brace_spike_effort)
  twitch_release: 0.6    # burst ends when it falls below this share of twitch_effort
  twitch_calm: 0.12      # "calm baseline" before the rise (and before a re-arm)
  twitch_rise_ms: 100    # must have been calm this long before crossing: slower ramps are ignored
  twitch_baseline_ms: 100  # ... and calm for this long before that (two twitches need ~200 ms of quiet between)
  twitch_min_ms: 150     # shorter than this is noise (the 100 ms window smears a burst by ~2 hops)
  twitch_max_ms: 400     # longer than this is a squeeze, not a twitch
  twitch_extensor_max: 0.18  # extensors must stay under this: a co-contraction is never a twitch
  twitch_max_gap_ms: 150 # a twitch / double twitch whose window spans a read gap longer than this is refused (nothing emitted)
  twitch_double_ms: 600  # second onset within this of the first = double twitch
  twitch_refractory_ms: 300  # after an emitted twitch / double, no burst becomes a twitch this long (emg.burst_onset still fires)
  # Calibration profile = data/profiles/<name>.json plus the optional overrides below.
  # `default` is the forearm profile. Select another with `profile:` here or build_emg(profile=).
  # Add `jaw` (item 4b) by filling in its overrides and recording a jaw calibration take.
  profile: default
  profiles:
    default: {}          # forearm: the shared keys above
    jaw: {}              # item 4b: channels / twitch_* overrides, e.g. {flexor_channels: [0], twitch_extensor_max: 1.0}
  # POST /api/emg/calibrate: seconds is clamped to this range, and the arm must be
  # disarmed or stopped (brace and open hand are not detected while a phase records).
  calibrate_min_s: 1.0
  calibrate_max_s: 10.0

compiler:
  llm: auto              # auto (use if MODEL_API_KEY set) | on | off
  base_url: https://api.meta.ai/v1
  model: muse-spark-1.1
  timeout_s: 4.0
  send_image: true
  tools: true            # Muse answers with h2m.embodied tool calls (false = old JSON verb path)

safety:
  auto_approve: 0.85     # act without asking at or above this confidence ...
  ask_below: 0.85        # ... ask between ask_floor and auto_approve
  ask_floor: 0.45        # hold below this
  target_margin: 0.20    # top target must beat the runner-up by this much
  confirm_timeout_s: 8.0
  always_confirm: true   # physical arm: every motion needs a confirmation
  default_grip: 0.5      # grip effort when nobody squeezed
  # Gesture exemption (REVIEWED RELAXATION, see h2m/safety.py::_gesture): a taught
  # gesture skips per-motion confirmation only if armed, gripper proven empty, every
  # step AND the arm's current pose within this envelope of home, at or below this speed.
  gesture_envelope_deg: 15
  gesture_speed_cap: 0.3
  gesture_wait_s: 8.0    # a request after a gesture in one reply is gated once it ends (or this passes)
  # Taught skills (configs/skills.yaml) always confirm. Those flagged near_person (hold_up,
  # take_this, sip) go near a face or a hand: HELD until this is true (REVIEWED RELAXATION
  # when switched on), and capped at near_person_speed_cap.
  near_person_enabled: false
  near_person_speed_cap: 0.3
  # A gripper load reading above this vetoes "gripper empty" (can only veto, never prove).
  # UNVERIFIED on hardware: check the idle STS3215 load at home before relying on it.
  gripper_empty_load_max: 0.15
  # place_near_user starts only when the arm is within this of the taught start pose
  # (configs/routes.yaml handover.from); its path is unproven from anywhere else.
  handover_start_tol_deg: 5.0
  # place_near_user lowers only after a hand pass newer than its arrival over the spot
  # (waited for up to handover_recheck_s). While lowering and releasing, a watchdog stops
  # the arm on any hand landmark within clear_radius + handover_watch_margin of the spot,
  # or when the newest hand pass is older than handover_watch_stale_ms. UNVERIFIED live.
  handover_recheck_s: 2.0
  handover_watch_margin: 0.05
  handover_watch_stale_ms: 500
  # The arm counts as hiding the spot from the scene camera within this of the handover
  # poses, unless routes.yaml handover.camera_sees_past_arm is true (checked at teach time).
  handover_occlusion_deg: 30.0
  # With EMG configured, no motion starts (and a moving arm stops) unless the newest EMG
  # sample is younger than this: the brace / open-hand stop must be live to move.
  emg_max_age_ms: 300
  # No squeeze answer (request or rule) and no rule approval of any kind begins within this
  # of the last brace, open hand (moving or not) or burst stop. Floor 3.0: only raise it.
  after_stop_s: 3.0
  # Operator gripper release (SAFETY REVIEW, h2m/app.py::release_gripper): opens the
  # gripper alone, outside any plan. OFF by default: POST /api/gripper/release answers
  # 403 and the app refuses. When on: only with the arm READY, at one of these taught
  # release-safe poses (within operator_release_tol_deg; "*.grasp" = every slot's grasp
  # pose; handover poses are always refused), and with a two-step confirm: the first
  # POST returns a release id, a second POST with it within operator_release_confirm_s
  # commits (same arming, same pose, nothing cancelled or stopped in between).
  operator_release: false
  operator_release_poses: [tray_release, tray_above, "*.grasp"]
  operator_release_tol_deg: 5.0
  operator_release_confirm_s: 10.0

selection:
  # Reflex cards (h2m/selection.py, docs/SELECTION_API.md). SAFETY REVIEW: a twitch is an
  # answer here. twitch = SELECT the highlighted card (a motion card is then announced and
  # shows "confirm?"; a second twitch confirms it, a double twitch goes back), double
  # twitch = next card, brace or open hand on an idle arm = refuse it (while moving they
  # freeze, unchanged). Confirming runs the card through the same tool path, gate and
  # confirmation as any tool request, and only answers the plain confirmation: a gate
  # question with a warning the card never showed (gripper not proven empty) waits for a
  # squeeze, yes or a click. A twitch never confirms any other request and never approves
  # a rule. Off until the bench shows twitches do not come out of startles.
  # Only the literal true enables it.
  enabled: false
  reaction_s: 0.7        # a select begins >= this after the UI ack of the card; a confirm >= this after the announcement finished playing (and its ack) (floor 0.3)
  require_ack: true      # the reaction clock starts at POST /api/selection/ack for that exact card (the select needs a fresh ack of "confirm?"); no ack = refused. false only for headless tests / scanning runs
  announce_max_s: 10.0   # the "confirm?" question must finish playing within this (cap 30), else the select is undone; voice off = no motion card can be confirmed
  after_veto_s: 3.0      # no select or confirm begins within this of any brace or open hand, swallowed ones too (floor 3.0); a refusal re-highlights
  confirm_s: 8.0         # an unanswered "confirm?" goes back to the menu this long after the announcement (or after the select if it was never announced) (cap 30)
  mode: intent           # intent (ranked cards, Muse upgrade) | scanning (fixed scene order, every option: the baseline)
  cards: 3               # intent mode shows this many (at most 3)
  muse: true             # intent mode asks Muse Spark to rank (needs MODEL_API_KEY); false = deterministic ranking only
  deadline_s: 2.5        # a Muse ranking later than this is dropped; no key / timeout / error switch to scanning for the run
  spark:                 # h2m.intent.SparkClient (base_url defaults to compiler.base_url)
    model: null          # null = env H2M_SPARK_MODEL, else muse-spark-1.3
    timeout_s: 2.0
    reasoning_effort: minimal
  reshow_s: 3.0          # after every card is refused, a stop or a cancel: wait this long before new cards
  veto_refractory_s: 1.5 # a flinch often fires brace AND open hand: within this, one refusal (both counted)
  table_x: [0.0, 1.0]    # table x range split into left / centre / right thirds (head direction tie-break)
  phrases: {}            # taught phrases offered as "say" cards, {id: text}; never model text

rules:
  user: default          # rule memory file: data/rules/<user>.json
  routes_file: configs/routes.yaml
  # Learned rules only restrict. These caps are shares of the configured maximum
  # and are clamped to <= 1.0 in code, so a bad value can never speed anything up.
  slow_down_speed: 0.5   # slow_down caps carry speed at this share of max_joint_speed
  grip_gentler: 0.6      # grip_gentler caps grip at this share of the object's max_grip
  proposal_timeout_s: 30 # an unanswered rule proposal is dropped (never saved)

incident:
  root: data/incidents   # saved clips, one folder per incident
  seconds: 6.0           # ring buffer length before the freeze
  fps: 5.0               # downsampled frame rate in the buffer
  sample_hz: 10          # sampler thread rate (frames, joints, contract, EMG)
  after_s: 1.0           # keep recording this long after the freeze
  downscale: 320         # longest image side kept in the buffer
  sam_model: sam-3.1     # SAM model id for the blame highlight (unverified live; env H2M_SAM_MODEL also works)

arm:
  backend: virtual       # virtual | lerobot
  port: null             # or env H2M_ARM_PORT
  robot_id: my_follower_arm
  poses_file: configs/poses.yaml
  skills_file: configs/skills.yaml
  control_hz: 30
  max_joint_speed_deg_s: 20
  max_gripper_speed_pct_s: 60
  max_step_deg: 4.0
  # Servo P_Coefficient overrides (LeRobot default 16). shoulder_lift stalled near full
  # reach with 16: at most max_step_deg of error x a soft gain barely beats gravity.
  p_gains:
    shoulder_lift: 28
  # 3.0 faulted every pick at the retreat: shoulder_lift holds 3.7 deg low at tray_above.
  arrive_tolerance_deg: 5.0
  tracking_error_deg: 20.0
  # Each plan may take factor x (its joint distance / speed + dwell) + margin, so a
  # slowed plan gets exactly the extra time its distance needs. UNVERIFIED on hardware.
  plan_budget_factor: 1.5
  plan_budget_margin_s: 3.0
  waypoint_stall_s: 1.5  # a waypoint commanded but not reached (arrive_tolerance) this long faults
  # Gripper percent-open values. Grip effort maps soft..hard into this range.
  gripper_open: 30      # matches the taught opening; wider can hit the tray at tray_release
  gripper_soft_close: 25
  gripper_hard_close: 0
  # Never exceed this share of servo torque (LeRobot burnout cap is 50%).
  max_gripper_torque: 0.5
  slot_tolerance: 0.12   # table distance from an object to a taught slot
  joint_limits:
    shoulder_pan: [-100, 100]
    shoulder_lift: [-100, 100]
    elbow_flex: [-100, 100]
    wrist_flex: [-100, 100]
    wrist_roll: [-150, 150]
    gripper: [0, 100]

server:
  host: 127.0.0.1
  port: 8080

demo:
  # `h2m demo` scripted scenario (h2m/scenario.py): virtual arm, synthetic EMG, canned
  # explanation, labelled SIMULATION. Pacing only: the gate, rules, stops and arm
  # limits above apply unchanged, and it refuses to run on anything but the virtual arm.
  sample_dir: data/demo  # bundled synthetic incidents served by `h2m demo`
  request: hand me the cup
  beat_s: 1.2            # pause between beats so a viewer can follow
  approve_after_s: 3.0   # scripted operator reads the rule card (never under 0.5 s; an approval within safety.after_stop_s of the brace is refused)
  brace_zone: laptop     # the synthetic brace fires as the carried cup reaches this zone ...
  brace_margin: 0.0      # ... within this table distance of it (schematic estimate) ...
  brace_fallback_s: 4.0  # ... or this long into the carry, whichever is first
  brace_drive: 0.9       # SyntheticSource drive on flexor and extensor during the brace
  brace_hold_s: 0.6
  step_timeout_s: 30.0   # a step that takes longer fails the scenario (and says which)
  loop_pause_s: 8.0      # `h2m demo --loop`: pause before the next pass
