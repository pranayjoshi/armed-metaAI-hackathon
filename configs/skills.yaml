# Taught skills: fixed sequences of taught poses, run through the same contract,
# gate and executor as every other motion. A skill never skips confirmation (unlike
# the five tiny gestures), so it may leave the home envelope; what it may not do is
# invent a pose: every `pose` here must exist in configs/poses.yaml, and the executor
# refuses any plan with an untaught pose on the real arm.
#
# Step forms:
#   - {pose: <name>, gripper: open|soft|keep, dwell: <s>}   move the arm (gripper optional)
#   - {gripper: open|soft, dwell: <s>}                       gripper only
# `{slot}` in a pose name is the slot of the requested object (requires_object: true).
# `{handover}` is the pose set for that object (arm.handover_sets in configs/armed.yaml):
# `{handover}_above` / `{handover}_release`. Both must be taught; the gate checks the
# object's own hand spot (routes handover.sets) and the hand watchdog runs while lowering.
# A {handover} skill needs requires_object and near_person.
#
# Flags (all default false / 1.0):
#   requires_object  the tool takes an object_id; the object must be visible and on a slot
#   needs_holding    only runs while holding something (a proven fact)
#   needs_empty      only runs with the gripper proven free (it will close on something)
#   carries          moves while holding: rules apply and the route must be proven
#   near_person      the arm goes near a face or a hand: refused unless
#                    safety.near_person_enabled is true, and capped at near_person_speed_cap
#   speed            plan speed cap (0.1..1.0), only ever lowered by the gate
#   say              one short line spoken when the skill starts (through the say tool)
skills:
  wave:
    say: "Hello."
    speed: 1.0
    steps:
      - {pose: wave_up}
      - {pose: wave_left}
      - {pose: wave_right}
      - {pose: wave_left}
      - {pose: wave_right}
      - {pose: wave_up, dwell: 0.2}
  bow:
    speed: 0.4
    steps:
      - {pose: bow_down, dwell: 0.6}
  celebrate:
    say: "Done!"
    speed: 0.5
    steps:
      - {pose: celebrate_up}
      - {pose: celebrate_left}
      - {pose: celebrate_right}
      - {pose: celebrate_left}
      - {pose: celebrate_up, dwell: 0.2}
  sorry:
    say: "Sorry."
    speed: 0.3
    steps:
      - {pose: sorry_back, dwell: 0.4}
      - {pose: sorry_low, dwell: 0.8}
  hold_up:
    # Pick the object from its slot, hold it at eye level for a while, put it back.
    requires_object: true
    needs_empty: true
    near_person: true
    speed: 0.4
    say: "Here."
    steps:
      - {pose: "{slot}.above", gripper: open}
      - {pose: "{slot}.grasp", gripper: open, dwell: 0.4}
      - {gripper: soft, dwell: 0.4}
      - {pose: "{slot}.above"}
      - {pose: hold_up, dwell: 6.0}
      - {pose: "{slot}.above"}
      - {pose: "{slot}.grasp", dwell: 0.4}
      - {gripper: open, dwell: 0.3}
      - {pose: "{slot}.above"}
  take_this:
    # Open hand at the handover spot, wait for the person to place something and let
    # go, close softly, carry it to the tray.
    needs_empty: true
    near_person: true
    speed: 0.4
    say: "Give it to me."
    steps:
      - {pose: handover_above, gripper: open}
      - {pose: handover_release, gripper: open, dwell: 3.0}
      - {gripper: soft, dwell: 0.5}
      - {pose: handover_above}
      - {pose: tray_above}
      - {pose: tray_release, dwell: 0.4}
      - {gripper: open, dwell: 0.3}
      - {pose: tray_above}
  hold_jar:
    # Open at the hand spot, wait for the jar to be held out, close softly and hold it while
    # the person twists the lid off. It stays closed: the card "Let go?" (let_go) opens it.
    needs_empty: true
    near_person: true
    speed: 0.4
    say: "I've got it."
    holds: jar
    steps:
      - {pose: jar_hold, gripper: open, dwell: 3.0}
      - {gripper: soft, dwell: 0.5}
  let_go:
    # Open where it is (the jar at the hand spot) and go home.
    needs_holding: true
    near_person: true
    speed: 0.4
    steps:
      - {gripper: open, dwell: 0.5}
      - {pose: home}
  sip:
    # Bring what is held (a cup with a straw) toward the mouth from below, hold, retreat.
    needs_holding: true
    carries: true
    near_person: true
    speed: 0.3
    say: "Here's a sip."
    steps:
      - {pose: face_above}
      - {pose: face_near, dwell: 4.0}
      - {pose: face_above}
  press_button:
    # Tap a taught button or switch position with the closed gripper.
    speed: 0.6
    steps:
      - {pose: press_above}
      - {pose: press_down, dwell: 0.3}
      - {pose: press_above}
  hand_over:
    # Pick the object from its slot and hand it to the person's hand: carry to the object's
    # handover pose set, lower, wait a moment, open, retreat. The close reaches the object
    # (the slot's taught point jaws). The marker's run stops at the lift (arm.handover_two_stage).
    requires_object: true
    needs_empty: true
    carries: true
    near_person: true
    speed: 0.4
    steps:
      - {pose: "{slot}.above", gripper: open}
      - {pose: "{slot}.grasp", gripper: open, dwell: 0.4}
      - {gripper: soft, dwell: 0.4}
      - {pose: "{slot}.above"}
      - {pose: "{handover}_above"}
      - {pose: "{handover}_release", dwell: 1.0}
      - {gripper: open, dwell: 0.5}
      - {pose: "{handover}_above"}
  bring_drink:
    # Pick the drink (the protein shake, straw in it) and bring it up to the taught spot by the
    # mouth, hold it while they sip, then put it back on its slot. Muse chooses it when it is
    # water time (or they ask for water) and this is the drink on the desk.
    requires_object: true
    needs_empty: true
    carries: true
    near_person: true
    speed: 0.3
    # Its path is slot 4's `direct` route (out over the laptop). A rule that removes direct
    # for what it carries (liquids off the laptop) runs the close twin on `via_high` instead.
    via_high: bring_drink_close
    steps:
      - {pose: "{slot}.above", gripper: open}
      - {pose: "{slot}.grasp", gripper: open, dwell: 0.4}
      - {gripper: soft, dwell: 0.4}
      - {pose: "{slot}.above"}
      - {pose: drink_above}
      - {pose: drink_up, dwell: 8.0}
      - {pose: drink_above}
      - {pose: "{slot}.above"}
      - {pose: "{slot}.grasp", dwell: 0.4}
      - {gripper: open, dwell: 0.3}
      - {pose: "{slot}.above"}
  bring_drink_close:
    # The same drink on slot 4's `via_high` route: folded in close to the robot, turned while
    # folded, up to the mouth beside the laptop. Chosen by the rules, never offered alone.
    requires_object: true
    needs_empty: true
    carries: true
    near_person: true
    speed: 0.3
    steps:
      - {pose: "{slot}.above", gripper: open}
      - {pose: "{slot}.grasp", gripper: open, dwell: 0.4}
      - {gripper: soft, dwell: 0.4}
      - {pose: "{slot}.above"}
      - {pose: drink_tuck}
      - {pose: drink_close}
      - {pose: drink_up, dwell: 8.0}
      - {pose: drink_close}
      - {pose: drink_tuck}
      - {pose: "{slot}.above"}
      - {pose: "{slot}.grasp", dwell: 0.4}
      - {gripper: open, dwell: 0.3}
      - {pose: "{slot}.above"}
  accept_item:
    # Someone offers something ("have some chips"): open to 70% at the visitor's spot, wait
    # three seconds for it to be put in, close softly and lift. It stays held: two cards
    # follow (stow_held into the tray, or hold_out_held for you).
    needs_empty: true
    near_person: true
    speed: 0.4
    say: "Thank you."
    holds: chips
    steps:
      - {pose: x_take_above, gripper: 70}
      - {pose: x_take_release, gripper: 70, dwell: 3.0}
      - {gripper: soft, dwell: 0.5}
      - {pose: x_take_above}
  stow_held:
    # What was taken in goes in the tray.
    needs_holding: true
    carries: true
    speed: 0.4
    steps:
      - {pose: tray_above}
      - {pose: tray_release, dwell: 0.4}
      - {gripper: open, dwell: 0.3}
      - {pose: tray_above}
  hold_out_held:
    # What was taken in is held up by the person (the hand-off spot) and stays there: the
    # tray move (stow_held) then waits as the question until they say "done".
    needs_holding: true
    carries: true
    near_person: true
    speed: 0.3
    say: "Here you go."
    holds: chips
    steps:
      - {pose: give_above}
  hand_keys:
    # The person gets up to leave: pick the keys from their slot and hold them out at the
    # taught spot by their hand, open, and go back.
    requires_object: true
    needs_empty: true
    carries: true
    near_person: true
    speed: 0.4
    say: "Keys. I'd come along, but I'm clamped to the desk."
    steps:
      - {pose: "{slot}.above", gripper: open}
      - {pose: "{slot}.grasp", gripper: open, dwell: 0.4}
      - {gripper: soft, dwell: 0.4}
      - {pose: "{slot}.above"}
      - {pose: give_above}
      - {pose: give_release, dwell: 2.0}
      - {gripper: open, dwell: 0.5}
      - {pose: give_above}
      - {pose: home}   # the door clicks; the arm settles home
      - {pose: give_above}
