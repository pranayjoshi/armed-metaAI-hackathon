[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armed"
version = "0.1.0"
description = "Armed: a third arm that autocompletes you. Context, voice and one forearm muscle become safety-gated robot step contracts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "opencv-python>=4.10",
]

[project.optional-dependencies]
emg = ["brainflow>=5.13"]
speech = ["sounddevice>=0.5", "websockets>=13"]
vision = []  # SAM 3.1 is a Meta Model API call: httpx and opencv in the core deps cover it
arm = ["lerobot[feetech]>=0.4"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
armed = "armed.cli:main"

[tool.setuptools.packages.find]
include = ["armed*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
