[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h2m"
version = "0.1.0"
description = "Human2Machine: speech, pointing and EMG compiled into safety-gated robot step contracts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "opencv-python>=4.10",
]

[project.optional-dependencies]
emg = ["brainflow>=5.13"]
speech = [
  "sounddevice>=0.5",
  "parakeet-mlx>=0.5; sys_platform == 'darwin'",
  "mlx-whisper>=0.4; sys_platform == 'darwin'",
]
vision = ["ultralytics>=8.4.0", "mediapipe>=0.10.30"]
arm = ["lerobot[feetech]>=0.4"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
h2m = "h2m.cli:main"

[tool.setuptools.packages.find]
include = ["h2m*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
