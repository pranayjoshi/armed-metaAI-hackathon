# Taught joint poses for the SO-101 follower (degrees; gripper 0-100 percent open).
#
# PLACEHOLDERS: the virtual arm can run them, the real arm refuses any pose
# with `taught: false`. Teach each by hand-guiding the follower (torque off):
#
#   h2m arm teach home
#   h2m arm teach slot_1.above
#
# Slots are marked table positions. `table_xy` uses the same coordinates as
# vision objects (normalized image coords, or table coords after calibration).
poses:
  home:
    taught: false
    joints: {shoulder_pan: 0, shoulder_lift: -90, elbow_flex: 90, wrist_flex: 60, wrist_roll: 0, gripper: 5}
  tray_above:
    taught: false
    joints: {shoulder_pan: 70, shoulder_lift: -30, elbow_flex: 40, wrist_flex: 60, wrist_roll: 0, gripper: 5}
  tray_release:
    taught: false
    joints: {shoulder_pan: 70, shoulder_lift: -10, elbow_flex: 30, wrist_flex: 65, wrist_roll: 0, gripper: 5}
  # Marked spot near the user for place_near_user (never into the hand). PLACEHOLDERS.
  handover_above:
    taught: false
    joints: {shoulder_pan: -60, shoulder_lift: -30, elbow_flex: 40, wrist_flex: 60, wrist_roll: 0, gripper: 5}
  handover_release:
    taught: false
    joints: {shoulder_pan: -60, shoulder_lift: -10, elbow_flex: 30, wrist_flex: 65, wrist_roll: 0, gripper: 5}
  # Carry-route via poses (see `routes:` below and configs/routes.yaml). PLACEHOLDERS.
  via_left:
    taught: false
    joints: {shoulder_pan: 40, shoulder_lift: -35, elbow_flex: 45, wrist_flex: 65, wrist_roll: 0, gripper: 5}
  via_high:
    taught: false
    joints: {shoulder_pan: 40, shoulder_lift: -60, elbow_flex: 70, wrist_flex: 55, wrist_roll: 0, gripper: 5}

# Carry routes: taught via poses visited between the lift and the tray, in order.
# Names match configs/routes.yaml; a route listed there but not here is never used.
# `direct` is the plain plan (no via poses). Teach via poses with `h2m arm teach via_left`.
  # Skill poses (configs/skills.yaml): placeholders, taught at teach time.
  wave_up:
    taught: false
    joints: {shoulder_pan: 0.0, shoulder_lift: -60.0, elbow_flex: 90.0, wrist_flex: 60.0, wrist_roll: 0.0, gripper: 5.0}
  wave_left:
    taught: false
    joints: {shoulder_pan: 0.0, shoulder_lift: -60.0, elbow_flex: 90.0, wrist_flex: 60.0, wrist_roll: -25.0, gripper: 5.0}
  wave_right:
    taught: false
    joints: {shoulder_pan: 0.0, shoulder_lift: -60.0, elbow_flex: 90.0, wrist_flex: 60.0, wrist_roll: 25.0, gripper: 5.0}
  bow_down:
    taught: false
    joints: {shoulder_pan: 0.0, shoulder_lift: -110.0, elbow_flex: 90.0, wrist_flex: 45.0, wrist_roll: 0.0, gripper: 5.0}
  celebrate_up:
    taught: false
    joints: {shoulder_pan: 0.0, shoulder_lift: -55.0, elbow_flex: 90.0, wrist_flex: 50.0, wrist_roll: 0.0, gripper: 5.0}
  celebrate_left:
    taught: false
    joints: {shoulder_pan: 0.0, shoulder_lift: -55.0, elbow_flex: 90.0, wrist_flex: 50.0, wrist_roll: -20.0, gripper: 5.0}
  celebrate_right:
    taught: false
    joints: {shoulder_pan: 0.0, shoulder_lift: -55.0, elbow_flex: 90.0, wrist_flex: 50.0, wrist_roll: 20.0, gripper: 5.0}
  sorry_back:
    taught: false
    joints: {shoulder_pan: 0.0, shoulder_lift: -100.0, elbow_flex: 90.0, wrist_flex: 72.0, wrist_roll: 0.0, gripper: 5.0}
  sorry_low:
    taught: false
    joints: {shoulder_pan: 0.0, shoulder_lift: -100.0, elbow_flex: 90.0, wrist_flex: 78.0, wrist_roll: 0.0, gripper: 5.0}
  hold_up:
    taught: false
    joints: {shoulder_pan: 0.0, shoulder_lift: -65.0, elbow_flex: 70.0, wrist_flex: 30.0, wrist_roll: 0.0, gripper: 5.0}
  face_above:
    taught: false
    joints: {shoulder_pan: 0.0, shoulder_lift: -75.0, elbow_flex: 65.0, wrist_flex: 40.0, wrist_roll: 0.0, gripper: 5.0}
  face_near:
    taught: false
    joints: {shoulder_pan: 0.0, shoulder_lift: -65.0, elbow_flex: 55.0, wrist_flex: 35.0, wrist_roll: 0.0, gripper: 5.0}
  press_above:
    taught: false
    joints: {shoulder_pan: 30.0, shoulder_lift: -80.0, elbow_flex: 90.0, wrist_flex: 60.0, wrist_roll: 0.0, gripper: 5.0}
  press_down:
    taught: false
    joints: {shoulder_pan: 30.0, shoulder_lift: -72.0, elbow_flex: 90.0, wrist_flex: 60.0, wrist_roll: 0.0, gripper: 5.0}

routes:
  direct: []
  via_left: [via_left]
  via_high: [via_high]

slots:
  slot_1:
    table_xy: [0.25, 0.55]
    above: {taught: false, joints: {shoulder_pan: -30, shoulder_lift: -20, elbow_flex: 30, wrist_flex: 70, wrist_roll: 0, gripper: 60}}
    grasp: {taught: false, joints: {shoulder_pan: -30, shoulder_lift: 0, elbow_flex: 20, wrist_flex: 75, wrist_roll: 0, gripper: 60}}
    point: {taught: false, joints: {shoulder_pan: -30, shoulder_lift: -40, elbow_flex: 45, wrist_flex: 70, wrist_roll: 0, gripper: 5}}
  slot_2:
    table_xy: [0.50, 0.55]
    above: {taught: false, joints: {shoulder_pan: 0, shoulder_lift: -20, elbow_flex: 30, wrist_flex: 70, wrist_roll: 0, gripper: 60}}
    grasp: {taught: false, joints: {shoulder_pan: 0, shoulder_lift: 0, elbow_flex: 20, wrist_flex: 75, wrist_roll: 0, gripper: 60}}
    point: {taught: false, joints: {shoulder_pan: 0, shoulder_lift: -40, elbow_flex: 45, wrist_flex: 70, wrist_roll: 0, gripper: 5}}
  slot_3:
    table_xy: [0.75, 0.55]
    above: {taught: false, joints: {shoulder_pan: 30, shoulder_lift: -20, elbow_flex: 30, wrist_flex: 70, wrist_roll: 0, gripper: 60}}
    grasp: {taught: false, joints: {shoulder_pan: 30, shoulder_lift: 0, elbow_flex: 20, wrist_flex: 75, wrist_roll: 0, gripper: 60}}
    point: {taught: false, joints: {shoulder_pan: 30, shoulder_lift: -40, elbow_flex: 45, wrist_flex: 70, wrist_roll: 0, gripper: 5}}

# Gestures: short sequences of taught poses within a small envelope around `home`
# (default 15 deg per joint, gripper unchanged). Run at low speed with an empty
# gripper. EVERY STEP IS A PLACEHOLDER (taught: false): capture each by hand-guiding
# the follower at teach time. The values below only show the intended shape.
# Joint keys must be exactly the six arm joints; names are free-form labels.
gestures:
  nod:
    - {name: nod_down, taught: false, joints: {shoulder_pan: 0, shoulder_lift: -90, elbow_flex: 90, wrist_flex: 72, wrist_roll: 0, gripper: 5}}
    - {name: nod_up, taught: false, joints: {shoulder_pan: 0, shoulder_lift: -90, elbow_flex: 90, wrist_flex: 52, wrist_roll: 0, gripper: 5}}
    - {name: nod_home, taught: false, joints: {shoulder_pan: 0, shoulder_lift: -90, elbow_flex: 90, wrist_flex: 60, wrist_roll: 0, gripper: 5}}
  tilt:
    - {name: tilt_left, taught: false, joints: {shoulder_pan: 0, shoulder_lift: -90, elbow_flex: 90, wrist_flex: 60, wrist_roll: 12, gripper: 5}}
    - {name: tilt_home, taught: false, joints: {shoulder_pan: 0, shoulder_lift: -90, elbow_flex: 90, wrist_flex: 60, wrist_roll: 0, gripper: 5}}
  shake:
    - {name: shake_left, taught: false, joints: {shoulder_pan: 12, shoulder_lift: -90, elbow_flex: 90, wrist_flex: 60, wrist_roll: 0, gripper: 5}}
    - {name: shake_right, taught: false, joints: {shoulder_pan: -12, shoulder_lift: -90, elbow_flex: 90, wrist_flex: 60, wrist_roll: 0, gripper: 5}}
    - {name: shake_home, taught: false, joints: {shoulder_pan: 0, shoulder_lift: -90, elbow_flex: 90, wrist_flex: 60, wrist_roll: 0, gripper: 5}}
  look_at_user:
    - {name: look_user, taught: false, joints: {shoulder_pan: 0, shoulder_lift: -80, elbow_flex: 85, wrist_flex: 70, wrist_roll: 0, gripper: 5}}
    - {name: look_user_home, taught: false, joints: {shoulder_pan: 0, shoulder_lift: -90, elbow_flex: 90, wrist_flex: 60, wrist_roll: 0, gripper: 5}}
  thinking:
    - {name: think_a, taught: false, joints: {shoulder_pan: 8, shoulder_lift: -84, elbow_flex: 90, wrist_flex: 66, wrist_roll: 8, gripper: 5}}
    - {name: think_b, taught: false, joints: {shoulder_pan: -8, shoulder_lift: -84, elbow_flex: 90, wrist_flex: 66, wrist_roll: -8, gripper: 5}}
    - {name: think_home, taught: false, joints: {shoulder_pan: 0, shoulder_lift: -90, elbow_flex: 90, wrist_flex: 60, wrist_roll: 0, gripper: 5}}
